<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <!-- ربط ملف التصميم الخارجي -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Noor Eldin Bakara</h1>
        <nav class="navbar">
            <span class="nav-name">Noor Eldin</span>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- قسم الصورة -->
        <section id="about" class="profile-section">
            <img src="images/me.jpg" alt="Photo of Noor Eldin" class="profile-img">
        </section>

        <!-- قسم الـ 3 كروت -->
        <section id="skills" class="cards-container">
            <div class="card">
                <h3>Programming</h3>
                <p>Learning C#, HTML, CSS, and JavaScript.</p>
            </div>
            <div class="card">
                <h3>Problem Solving</h3>
                <p>Data structures and algorithms practice.</p>
            </div>
            <div class="card">
                <h3>Football</h3>
                <p>Watching European leagues and playing football.</p>
            </div>
        </section>

        <!-- قسم الفورم والزرار -->
        <section id="contact" class="contact-section">
            <form>
                <div class="form-group">
                    <label for="visitor-name">Name:</label>
                    <input type="text" id="visitor-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
            </form>

            <button id="theme-btn">Toggle Dark Mode</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Noor Eldin Bakara. All rights reserved.</p>
    </footer>

    <!-- ربط ملف الجافاسكريبت في آخر الـ body -->
    <script src="js/script.js"></script>
</body>
</html>
